appId: dev.kib.mailkib
productName: MailKib
copyright: Copyright © 2026 kib

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'

# Used by the first-run desktop-entry installer when running as an AppImage.
extraResources:
  - from: build/icon.png
    to: icon.png

asar: true
npmRebuild: false

linux:
  syncDesktopName: true
  target:
    - AppImage
  icon: build/icon.png
  category: Network
  synopsis: A fast, keyboard-first mail client
  description: >-
    MailKib is a minimal, keyboard-driven desktop mail client for Gmail and
    Microsoft accounts, themed after Tokyo Night. Each install uses its own
    OAuth credentials; nothing is proxied through a third party.
  maintainer: kib <kibssbu@gmail.com>
  desktop:
    entry:
      Name: MailKib
      GenericName: Mail Client
      Categories: Network;Email;
      Keywords: Email;Mail;Gmail;Outlook;Inbox;
      MimeType: x-scheme-handler/mailto;
      StartupWMClass: MailKib

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

pacman:
  artifactName: ${productName}-${version}-${arch}.pacman
  depends:
    - gtk3
    - nss
    - libxss
    - libnotify

deb:
  artifactName: ${productName}-${version}-${arch}.deb
